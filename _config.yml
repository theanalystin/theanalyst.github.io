title: The Analyst
description: Practical business analytics, SQL, BI and performance analysis tutorials for aspiring analysts and decision-makers.
url: "https://theanalyst.in"
baseurl: ""
lang: en
timezone: Asia/Kolkata
markdown: kramdown
permalink: /:categories/:title/
future: false
show_excerpts: true
twitter:
  card: summary_large_image
logo: /assets/img/og-default.svg
image: /assets/img/og-default.svg
social:
  name: The Analyst
  links:
    - https://github.com/theanalystin/theanalyst.github.io
plugins: [jekyll-seo-tag, jekyll-sitemap, jekyll-feed]
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: The Analyst
exclude: [README.md, Gemfile, Gemfile.lock, scripts/, vendor/, content-calendar.md]
