<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Latest business and market news from The Analyst.">
<link rel="canonical" href="https://theanalyst.in/news/">
<title>Business News | The Analyst</title>
<style>
:root{color-scheme:dark;--bg:#111315;--text:#f2f3f4;--muted:#a4a8aa;--line:#45494b;--accent:#459cf3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{width:min(820px,calc(100% - 32px));margin:auto}.header{padding:22px 0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;font-weight:800;letter-spacing:-.5px}.brand span{color:var(--accent)}.refresh{background:none;color:var(--muted);border:1px solid #45494b;border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}.refresh:disabled{opacity:.6}.status{font-size:12px;color:var(--muted);padding:13px 0 8px}.list{border-top:1px solid var(--line)}.item{padding:17px 0;border-bottom:1px solid var(--line)}.headline{display:block;font-size:18px;line-height:1.45;font-weight:550}.headline:hover{color:#82bcff}.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:7px;color:var(--muted);font-size:12px}.empty{padding:22px 0;color:var(--muted)}@media(min-width:650px){.header{padding-top:27px}.item{padding:20px 0}.headline{font-size:19px}}
</style>
</head>
<body>
<main class="wrap">
<header class="header"><a class="brand" href="/">The<span>Analyst</span> · News</a><button class="refresh" id="refresh" type="button">↻ Refresh</button></header>
<div class="status" id="status" aria-live="polite">Loading latest headlines…</div>
<section class="list" id="list" aria-label="Business news headlines" aria-live="polite"><div class="empty">Loading news…</div></section>
</main>
<script>
(function(){
const feeds=[
"https://news.google.com/rss/search?q=India+business+markets+when%3A2d&hl=en-IN&gl=IN&ceid=IN%3Aen",
"https://news.google.com/rss/search?q=Indian+stock+market+Nifty+Sensex+when%3A2d&hl=en-IN&gl=IN&ceid=IN%3Aen",
"https://news.google.com/rss/search?q=India+companies+earnings+IPO+business+when%3A2d&hl=en-IN&gl=IN&ceid=IN%3Aen",
"https://news.google.com/rss/search?q=India+economy+startups+technology+when%3A2d&hl=en-IN&gl=IN&ceid=IN%3Aen"
];
const endpoint="https://api.rss2json.com/v1/api.json?rss_url=";
const list=document.getElementById("list"),status=document.getElementById("status"),button=document.getElementById("refresh");
let busy=false,items=[];
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function age(value){const d=new Date(value);if(isNaN(d))return"Recently";const n=Math.max(0,Math.floor((Date.now()-d.getTime())/60000));if(n<1)return"Just now";if(n<60)return n+" min ago";if(n<1440)return Math.floor(n/60)+" hr ago";return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});}
function render(){if(!items.length){list.innerHTML='<div class="empty">News is temporarily unavailable. Please try refreshing.</div>';return;}list.innerHTML=items.map(s=>'<article class="item"><a class="headline" href="'+esc(s.link)+'" target="_blank" rel="noopener noreferrer">'+esc(s.title)+'</a><div class="meta"><span>'+esc(s.source)+'</span><span>'+esc(age(s.date))+'</span></div></article>').join("");}
async function load(){if(busy)return;busy=true;button.disabled=true;button.textContent="Updating…";status.textContent="Updating headlines…";try{const results=await Promise.allSettled(feeds.map(async url=>{const r=await fetch(endpoint+encodeURIComponent(url),{cache:"no-store"});if(!r.ok)throw Error("Feed unavailable");const d=await r.json();if(d.status!=="ok")throw Error("Feed unavailable");return(d.items||[]).map(x=>({title:(x.title||"").trim(),link:x.link||"",date:x.pubDate||"",source:(x.author||"News").split(" - ")[0]}));}));const fresh=results.filter(x=>x.status==="fulfilled").flatMap(x=>x.value).filter(x=>x.title&&x.link);const unique=new Map();fresh.forEach(x=>{const k=x.title.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();if(!unique.has(k))unique.set(k,x);});const sorted=[...unique.values()].sort((a,b)=>(new Date(b.date).getTime()||0)-(new Date(a.date).getTime()||0));if(sorted.length)items=sorted;else if(!items.length)throw Error("Could not connect to news feeds.");render();status.textContent="Updated "+new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})+" · Auto-refresh every 5 minutes";}catch(e){status.textContent=items.length?"Could not refresh · Showing last loaded headlines":"News feed unavailable";render();}finally{busy=false;button.disabled=false;button.textContent="↻ Refresh";}}
button.addEventListener("click",load);load();setInterval(load,300000);
})();
</script>
</body>
</html>
