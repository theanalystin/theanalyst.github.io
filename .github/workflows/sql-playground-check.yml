name: SQL Playground checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/client-side-analytics-v2]

permissions:
  contents: read

jobs:
  build-and-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Jekyll dependencies
        run: bundle install

      - name: Build static site
        run: JEKYLL_ENV=production bundle exec jekyll build

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check embedded JavaScript syntax
        run: |
          python - <<'PY'
          import re
          source = open('sql-playground.html', encoding='utf-8').read()
          match = re.search(r'<script type="module">(.*?)</script>', source, re.S)
          assert match, 'SQL Playground module script not found'
          open('/tmp/sql-playground.mjs', 'w', encoding='utf-8').write(match.group(1))
          PY
          node --check /tmp/sql-playground.mjs

      - name: Install temporary Playwright test dependency
        run: npm install --no-save --package-lock=false playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Jekyll server
        run: |
          bundle exec jekyll serve --host 127.0.0.1 --port 4000 --no-watch > /tmp/jekyll.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/sql-playground/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/jekyll.log
          exit 1

      - name: Test responsive layout, chart types, and exports
        run: node scripts/test-sql-playground.mjs

      - name: Upload 375px and 1280px screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-playground-responsive-screenshots
          path: /tmp/sql-playground-screenshots/*.png
          if-no-files-found: ignore
