<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Illustrative KPI target and actual comparisons</title><desc id="desc">Four panels compare synthetic target and actuals separately by unit. Orders processed, on-time completion, handling cost per order, and satisfaction. Bars are indexed within each KPI to target equals 100 percent.</desc>
<rect width="1000" height="560" rx="10" fill="#fff" stroke="#dce2dc"/>
<text x="38" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d2521">Target vs actual · synthetic sample</text>
<text x="38" y="76" font-family="Arial, sans-serif" font-size="14" fill="#68736c">Bars are indexed to target = 100; labels preserve each metric's original unit.</text>
<g font-family="Arial, sans-serif">
<text x="40" y="135" font-size="18" font-weight="700" fill="#1d2521">Orders processed</text><text x="40" y="163" font-size="14" fill="#68736c">Target 10,000 · Actual 9,200</text>
<rect x="40" y="180" width="420" height="22" rx="4" fill="#e8f0eb"/><rect x="40" y="180" width="386" height="22" rx="4" fill="#28664f"/><text x="470" y="198" font-size="15" fill="#1d2521">92% of target</text>
<text x="520" y="135" font-size="18" font-weight="700" fill="#1d2521">On-time completion</text><text x="520" y="163" font-size="14" fill="#68736c">Target 95% · Actual 91%</text>
<rect x="520" y="180" width="420" height="22" rx="4" fill="#e8f0eb"/><rect x="520" y="180" width="402" height="22" rx="4" fill="#28664f"/><text x="928" y="198" font-size="15" fill="#1d2521">96%</text>
<text x="40" y="295" font-size="18" font-weight="700" fill="#1d2521">Handling cost per order</text><text x="40" y="323" font-size="14" fill="#68736c">Target ₹120 · Actual ₹126 · lower is better</text>
<rect x="40" y="340" width="420" height="22" rx="4" fill="#e8f0eb"/><rect x="40" y="340" width="420" height="22" rx="4" fill="#a8beb0"/><text x="470" y="358" font-size="15" fill="#1d2521">105% of target cost</text>
<text x="520" y="295" font-size="18" font-weight="700" fill="#1d2521">Customer satisfaction</text><text x="520" y="323" font-size="14" fill="#68736c">Target 4.5/5 · Actual 4.3/5</text>
<rect x="520" y="340" width="420" height="22" rx="4" fill="#e8f0eb"/><rect x="520" y="340" width="401" height="22" rx="4" fill="#28664f"/><text x="928" y="358" font-size="15" fill="#1d2521">96%</text>
</g>
<path d="M40 415H960" stroke="#dce2dc"/>
<text x="40" y="455" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d2521">Interpretation</text>
<text x="40" y="485" font-family="Arial, sans-serif" font-size="15" fill="#68736c">All four measures miss target in this example. The data identifies gaps, not their causes.</text>
<text x="40" y="512" font-family="Arial, sans-serif" font-size="15" fill="#68736c">Source: manually created synthetic values for teaching; no live data connection.</text>
</svg>
